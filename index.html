
<div id="jarvis-voice" style="padding:20px;font-family:Arial,sans-serif;background:#101827;color:#fff;border-radius:14px;margin:16px 0">
  <h2>J.A.R.V.I.S. Voice</h2>
  <p id="jarvis-status">System ready. Awaiting your command.</p>

  <select id="jarvis-lang" style="padding:10px">
    <option value="en-US">English</option>
    <option value="ur-PK">Urdu</option>
  </select>

  <p>
    <button id="jarvis-listen" style="padding:12px">🎙️ Talk to JARVIS</button>
    <button id="jarvis-speak" style="padding:12px">🔊 Speak</button>
  </p>

  <textarea id="jarvis-input" placeholder="Type your command here..."
    style="width:95%;min-height:75px;padding:10px"></textarea>
  <p><button id="jarvis-send" style="padding:12px">Send command</button></p>
  <p id="jarvis-reply">JARVIS is standing by.</p>
</div>

<script>
(() => {
  const $ = id => document.getElementById("jarvis-" + id);
  let answer = "Hello! I am JARVIS. How can I help you?";

  function speak(text) {
    if (!("speechSynthesis" in window)) {
      $("status").textContent = "Speech output is not supported.";
      return;
    }
    speechSynthesis.cancel();
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = $("lang").value;
    speechSynthesis.speak(msg);
  }

  function respond(command) {
    const q = command.toLowerCase().trim();

    if (/^(hi|hello|hey jarvis|salam|assalam|aoa)/i.test(q)) {
      answer = "Hello! JARVIS is ready to assist you.";
    } else if (q.includes("time") || q.includes("waqt")) {
      answer = "The time is " + new Date().toLocaleTimeString();
    } else if (q.includes("date") || q.includes("tareekh")) {
      answer = "Today's date is " + new Date().toLocaleDateString();
    } else if (q.includes("youtube")) {
      answer = "Opening YouTube.";
      window.open("https://www.youtube.com/", "_blank", "noopener");
    } else if (q.includes("google")) {
      answer = "Opening Google.";
      window.open("https://www.google.com/", "_blank", "noopener");
    } else {
      answer = "I received your command: " + command +
        ". My AI brain is not connected yet.";
    }

    $("reply").textContent = answer;
    $("status").textContent = "Command processed.";
  }

  $("send").addEventListener("click", () => {
    const command = $("input").value.trim();
    if (command) respond(command);
  });

  $("speak").addEventListener("click", () => speak(answer));

  $("listen").addEventListener("click", () => {
    const SR = window.SpeechRecognition ||
               window.webkitSpeechRecognition;

    if (!SR) {
      $("status").textContent =
        "Speech recognition is unavailable. Try Chrome.";
      return;
    }

    const recognition = new SR();
    recognition.lang = $("lang").value;
    recognition.continuous = false;
    recognition.interimResults = false;

    $("status").textContent = "Listening...";

    recognition.onresult = event => {
      const command = event.results[0][0].transcript;
      $("input").value = command;
      respond(command);
      speak(answer);
    };

    recognition.onerror = event => {
      $("status").textContent = "Voice error: " + event.error;
    };

    recognition.onend = () => {
      if ($("status").textContent === "Listening...") {
        $("status").textContent = "Listening ended.";
      }
    };

    try {
      recognition.start();
    } catch (error) {
      $("status").textContent = "Please try the microphone again.";
    }
  });
})();
 </script>

</body>
</html>
